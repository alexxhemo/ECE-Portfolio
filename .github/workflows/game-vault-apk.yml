name: Build Game Vault APK

on:
  push:
    branches: [ game-vault-apk-build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct Android project
        run: |
          cat .game-vault-build/part00.b64 .game-vault-build/part01.b64 .game-vault-build/part02a.b64 .game-vault-build/part02b.b64 .game-vault-build/part03.b64 > gamevault.b64
          base64 -d gamevault.b64 > gamevault.zip
          unzip -q gamevault.zip
          ls -la GameVaultAndroid

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: GameVaultAndroid
        run: gradle assembleDebug

      - name: Rename APK
        run: cp GameVaultAndroid/app/build/outputs/apk/debug/app-debug.apk GameVault.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GameVault-APK
          path: GameVault.apk
